<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>JARVIS · FLAMTEC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="description" content="JARVIS FLAMTEC: entrada única a las áreas de la empresa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<style>
  html, body { margin: 0; height: 100%; background: #0B2545; overflow: hidden; }
  #jv { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0B2545; }
  #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; color: #fff; font: 15px/1.4 Arial, sans-serif; background: #0B2545; transition: opacity .4s; }
  #carga img { width: 96px; height: 96px; border-radius: 22px; }
  #carga.fuera { opacity: 0; pointer-events: none; }
  #ayuda { display: none; max-width: 320px; text-align: center; font-size: 13px; opacity: .85; }
  #ayuda a { color: #FF9A3C; }
</style>
</head>
<body>
<div id="carga">
  <img src="icon-192.png" alt="">
  <div>Abriendo JARVIS…</div>
  <div id="ayuda">¿No abre? <a id="sola" href="#" target="_blank" rel="noopener">Ábralo aquí</a></div>
</div>
<iframe id="jv" title="JARVIS FLAMTEC" allow="microphone; autoplay; clipboard-write; camera"></iframe>
<script>
  // Dirección publicada de la entrada única de JARVIS (Apps Script). Si cambia, se cambia solo aquí.
  var JARVIS = "https://script.google.com/macros/s/AKfycbxjMhR9zbZMFq6euNKBs2-J9pXYNHMiy1P48zYavlMCvGSN0JaqHr2tTEzTepIY7qLa/exec";
  var f = document.getElementById("jv"), c = document.getElementById("carga");
  document.getElementById("sola").href = JARVIS;
  f.addEventListener("load", function () { setTimeout(function () { c.classList.add("fuera"); }, 600); });
  setTimeout(function () { document.getElementById("ayuda").style.display = "block"; }, 12000);
  f.src = JARVIS;
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }

  // 25/11/2026: micrófono para «Pregúntele a JARVIS». Google no deja usar el micrófono dentro de su recuadro,
  // así que JARVIS le pide a esta página que escuche y ella le devuelve lo que la persona dijo. No guarda nada.
  (function () {
    var R = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, quien = null;
    function avisar(m) { try { if (quien) quien.postMessage(m, "*"); } catch (_) {} }
    window.addEventListener("message", function (e) {
      var d = e.data; if (!d || d.jarvisVoz === undefined) return;
      if (d.jarvisVoz === "hola") { e.source && e.source.postMessage({ jarvisVoz: "lista", puede: !!R }, "*"); return; }
      if (d.jarvisVoz === "parar") { if (rec) try { rec.stop(); } catch (_) {} return; }
      if (d.jarvisVoz !== "escuchar") return;
      quien = e.source;
      if (!R) { avisar({ jarvisVoz: "error", motivo: "sin-dictado" }); return; }
      if (rec) try { rec.abort(); } catch (_) {}
      var r = new R(); rec = r; r.lang = "es-CO"; r.interimResults = true; r.continuous = false;
      r.onstart = function () { avisar({ jarvisVoz: "escuchando" }); };
      r.onresult = function (ev) { var t = ""; for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; avisar({ jarvisVoz: "texto", t: t }); };
      r.onerror = function (ev) { avisar({ jarvisVoz: "error", motivo: ev.error || "" }); };
      r.onend = function () { if (rec === r) rec = null; avisar({ jarvisVoz: "fin" }); };
      try { r.start(); } catch (err) { avisar({ jarvisVoz: "error", motivo: "no-arranca" }); }
    });
  })();
</script>
</body>
</html>
